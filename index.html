<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Suisse Info Hub</title>
</head>
<body>
    <div id="contenu-article">Chargement de l'article automatique...</div>

    <script>
        // Le site va chercher le fichier article.html déposé automatiquement par Make
        fetch('article.html')
            .then(response => {
                if (!response.ok) throw new Error('Fichier introuvable');
                return response.text();
            })
            .then(data => {
                document.getElementById('contenu-article').innerHTML = data;
            })
            .catch(error => {
                document.getElementById('contenu-article').innerHTML = "L'article est en cours de préparation par l'IA...";
                console.error(error);
            });
    </script>
</body>
</html>
