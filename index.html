<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Site Automatisé</title>
</head>
<body>
    <div id="contenu-article">Chargement de l'article en cours...</div>

    <script>
        // Identifiant unique et direct de votre fichier Google Drive
        const fileId = "1NRQ_CvXq_egfWxNMoJmY7vUonIqVofxH";

        // Adresse de lecture directe officielle de Google
        const urlDirecte = `https://google.com{fileId}`;

        fetch(urlDirecte)
            .then(response => response.text())
            .then(data => {
                document.getElementById('contenu-article').innerHTML = data;
            })
            .catch(error => {
                document.getElementById('contenu-article').innerHTML = "Erreur de chargement de l'article.";
                console.error(error);
            });
    </script>
</body>
</html>
